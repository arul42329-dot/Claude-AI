name: Build JARVIS APK

on:
  push:
    branches:
      - arena/01a0ffb7-claude-ai
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository keeps its build configuration source-only; this supplies Gradle 8.9
      # on the hosted runner without relying on a locally preinstalled Gradle binary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run parser tests and build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test assembleDebug 2>&1 | tee gradle-build.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Gradle build failure"
            echo '```text'
            tail -n 180 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          check_id="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "Test and build debug APK").id' | head -n 1)"
          if [ -n "$check_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
              -f 'output[title]=Gradle build failure' \
              -f "output[summary]=$(tail -n 180 gradle-build.log)" >/dev/null
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
