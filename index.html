<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Edgefolio — Forex Trade Journal</title>
    <style>
      /* Instant branded backdrop painted on the very first frame, so there's no
         white flash while the bundle parses and the database initialises. It is
         removed by main.tsx once React has mounted (the animated splash, which
         sits above it, then plays over the ready app). */
      html, body { margin: 0; background: #08090c; }
      #boot {
        position: fixed; inset: 0; z-index: 900;
        background: radial-gradient(1000px 620px at 50% 32%, rgba(232, 180, 88, 0.14) 0%, #08090c 60%), #08090c;
        transition: opacity 0.4s ease;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
